<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Reset Password - Perpustakaan SMK4BJN</title>
    <link href="{{ asset('template/vendor/fontawesome-free/css/all.min.css') }}" rel="stylesheet">
    <link href="{{ asset('template/css/sb-admin-2.min.css') }}" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css?family=Inter:300,400,500,600,700,800,900" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/sweetalert2@11/dist/sweetalert2.min.css">

    <style>
        :root { --primary: #2C5AA0; --primary-light: #4A7BC8; --gray: #6C757D; --radius: 8px; }
        body { font-family: 'Inter', sans-serif; background: #f8f9fc; display: flex; align-items: center; justify-content: center; height: 100vh; margin: 0; }
        .reset-card { background: white; width: 100%; max-width: 450px; padding: 40px; border-radius: 16px; box-shadow: 0 10px 25px rgba(0,0,0,0.05); }
        .brand-logo { color: var(--primary); font-size: 24px; font-weight: 800; text-align: center; margin-bottom: 30px; }
        .form-group label { font-weight: 700; font-size: 12px; text-transform: uppercase; color: #444; }
        .form-control { height: 45px; border-radius: var(--radius); font-size: 14px; }
        .btn-reset { width: 100%; height: 45px; background: var(--primary); color: white; border: none; border-radius: var(--radius); font-weight: 600; transition: 0.3s; }
        .btn-reset:hover { background: var(--primary-light); transform: translateY(-1px); }
        .d-none { display: none; }
    </style>
</head>
<body>

<div class="reset-card">
    <div class="brand-logo"><i class="fas fa-book-reader mr-2"></i>SMK4BJN</div>
    
    <h4 class="font-weight-bold text-dark" id="ui-title">Lupa Password?</h4>
    <p class="text-muted small mb-4" id="ui-subtitle">Verifikasi NISN dan Email Anda untuk mereset password.</p>

    <form id="resetForm">
        <div id="step-1">
            <div class="form-group">
                <label>Alamat Email</label>
                <input type="email" id="email" class="form-control" placeholder="nama@email.com" required>
            </div>
            <div class="form-group">
                <label>NISN</label>
                <input type="text" id="nisn" class="form-control" placeholder="Masukkan 10 digit NISN" required>
            </div>
        </div>

        <div id="step-2" class="d-none">
            <div class="form-group">
                <label>Password Baru</label>
                <input type="password" id="new_password" class="form-control" placeholder="Minimal 8 karakter">
            </div>
            <div class="form-group">
                <label>Konfirmasi Password Baru</label>
                <input type="password" id="confirm_password" class="form-control" placeholder="Ulangi password">
            </div>
        </div>

        <button type="submit" class="btn-reset mt-3" id="btnSubmit">
            <span id="btnText">Verifikasi Sekarang</span>
        </button>
    </form>

    <div class="text-center mt-4">
        <a href="/login" class="small text-decoration-none" style="color: var(--primary); font-weight: 600;">Kembali ke Login</a>
    </div>
</div>

<script src="{{ asset('template/vendor/jquery/jquery.min.js') }}"></script>
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

<script>
let currentStep = 1;
let userId = null;

$('#resetForm').on('submit', async function(e) {
    e.preventDefault();
    
    const btn = $('#btnSubmit');
    const btnText = $('#btnText');

    if (currentStep === 1) {
        // --- LOGIKA VERIFIKASI ---
        btn.prop('disabled', true).css('opacity', '0.7');
        
        try {
            const response = await fetch('http://localhost:8000/api/forgot-password', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json', 'Accept': 'application/json' },
                body: JSON.stringify({
                    email: $('#email').val(),
                    nisn: $('#nisn').val()
                })
            });
            const data = await response.json();

            if (response.ok) {
                userId = data.user_id;
                // Pindah ke tampilan ganti password
                $('#step-1').addClass('d-none');
                $('#step-2').removeClass('d-none');
                $('#ui-title').text('Ganti Password');
                $('#ui-subtitle').text('Gunakan kombinasi password yang kuat.');
                btnText.text('Update Password');
                currentStep = 2;
                
                Swal.fire({ icon: 'success', title: 'Data Cocok!', text: data.message, timer: 2000 });
            } else {
                Swal.fire('Gagal', data.message || 'Data tidak ditemukan', 'error');
            }
        } catch (err) {
            Swal.fire('Error', 'Gagal menghubungi server', 'error');
        } finally {
            btn.prop('disabled', false).css('opacity', '1');
        }

    } else {
        // --- LOGIKA UPDATE PASSWORD ---
        const p1 = $('#new_password').val();
        const p2 = $('#confirm_password').val();

        if (p1.length < 8) return Swal.fire('Peringatan', 'Password minimal 8 karakter!', 'warning');
        if (p1 !== p2) return Swal.fire('Error', 'Konfirmasi password tidak cocok!', 'error');

        btn.prop('disabled', true);
        try {
            const response = await fetch('http://localhost:8000/api/reset-password', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json', 'Accept': 'application/json' },
                body: JSON.stringify({
                    user_id: userId,
                    password: p1,
                    password_confirmation: p2
                })
            });

            if (response.ok) {
                Swal.fire('Berhasil!', 'Password diperbarui. Silakan login.', 'success')
                .then(() => window.location.href = '/login');
            } else {
                Swal.fire('Gagal', 'Terjadi kesalahan saat update.', 'error');
            }
        } catch (err) {
            Swal.fire('Error', 'Server tidak merespon', 'error');
        } finally {
            btn.prop('disabled', false);
        }
    }
});
</script>
</body>
</html>
